dependencies:
  # iperf2-compatible throughput testing, used by `wifi iperf`.
  espressif/iperf-cmd: "~1.0.2"

  # LittleFS backs the configuration partition. The application mounts it;
  # config_store deliberately takes paths and mounts nothing itself.
  joltwallet/littlefs: "^1.20"

  # The shared components, each pinned to a tag in the esp_components repository.
  # Only what this project uses directly is listed: each component names its own
  # siblings, so cli brings diag, ota brings http_server, and the managers bring
  # js2c and net_events without this file having to know that.
  #
  # `version` is a git ref, not a semver range -- the component manager checks out
  # exactly this tag. Upgrading one component is editing one line here; nothing
  # else in the project changes, because components are found by name.
  #
  # To work on a component and this project at the same time, point the build at a
  # checkout instead: a local component of the same name wins over the fetched one.
  #
  #     idf.py -DESP_COMPONENTS_DIR=../esp_components build
  #
  cli:
    git: https://github.com/benvonhandorf/esp_components.git
    path: cli
    version: cli-v0.2.0
  cli_web:
    git: https://github.com/benvonhandorf/esp_components.git
    path: cli_web
    version: cli_web-v0.2.1
  config_store:
    git: https://github.com/benvonhandorf/esp_components.git
    path: config_store
    version: config_store-v0.1.0
  # NOTE: this asks for v0.1.1 and the build resolves v0.1.0. cli, cli_web and
  # mqtt_manager each pin diag-v0.1.0 themselves, and the solver takes those over
  # the direct pin here without reporting a conflict -- check `dependencies.lock`,
  # not this line, for what was actually fetched. Nothing is lost by it: v0.1.1
  # changes only a comment in diag.h. It takes effect once those three are retagged.
  diag:
    git: https://github.com/benvonhandorf/esp_components.git
    path: diag
    version: diag-v0.1.1
  http_server:
    git: https://github.com/benvonhandorf/esp_components.git
    path: http_server
    version: http_server-v0.2.0
  js2c:
    git: https://github.com/benvonhandorf/esp_components.git
    path: js2c
    version: js2c-v0.1.0
  mdns_manager:
    git: https://github.com/benvonhandorf/esp_components.git
    path: mdns_manager
    version: mdns_manager-v0.1.0
  mqtt_manager:
    git: https://github.com/benvonhandorf/esp_components.git
    path: mqtt_manager
    version: mqtt_manager-v0.1.0
  net_events:
    git: https://github.com/benvonhandorf/esp_components.git
    path: net_events
    version: net_events-v0.1.0
  ntp_manager:
    git: https://github.com/benvonhandorf/esp_components.git
    path: ntp_manager
    version: ntp_manager-v0.1.1
  ota:
    git: https://github.com/benvonhandorf/esp_components.git
    path: ota
    version: ota-v0.1.0
  wifi_manager:
    git: https://github.com/benvonhandorf/esp_components.git
    path: wifi_manager
    version: wifi_manager-v0.2.0

  # Device drivers, from the same repository and pinned the same way. Each is a
  # part this rig can exercise; the console half of each stays in main/, because
  # a component returns facts and the application formats prose.
  aw9523b:
    git: https://github.com/benvonhandorf/esp_components.git
    path: aw9523b
    version: aw9523b-v0.1.0
  hx711:
    git: https://github.com/benvonhandorf/esp_components.git
    path: hx711
    version: hx711-v0.1.0
  ina219:
    git: https://github.com/benvonhandorf/esp_components.git
    path: ina219
    version: ina219-v0.2.0
  ina226:
    git: https://github.com/benvonhandorf/esp_components.git
    path: ina226
    version: ina226-v0.2.0
  ina237:
    git: https://github.com/benvonhandorf/esp_components.git
    path: ina237
    version: ina237-v0.1.0
  lm75bdp:
    git: https://github.com/benvonhandorf/esp_components.git
    path: lm75bdp
    version: lm75bdp-v0.1.0
  nau7802:
    git: https://github.com/benvonhandorf/esp_components.git
    path: nau7802
    version: nau7802-v0.2.0
  pi4ioe5v6408:
    git: https://github.com/benvonhandorf/esp_components.git
    path: pi4ioe5v6408
    version: pi4ioe5v6408-v0.1.0
  rx8130ce:
    git: https://github.com/benvonhandorf/esp_components.git
    path: rx8130ce
    version: rx8130ce-v0.1.0
  sht4x:
    git: https://github.com/benvonhandorf/esp_components.git
    path: sht4x
    version: sht4x-v0.1.0
